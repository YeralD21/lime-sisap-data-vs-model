# Fuentes de datos del Experimento 2 (limón, SISAP diario).
# Fecha de consulta inicial: 2026-11-14. Ver reportes/INFORME_DIA1.md.
# Los datos crudos descargados van a data/raw/ (no se versionan).

cliente_http:
  user_agent: "lime-sisap-data-vs-model/0.1 (investigacion academica; reconocimiento de datos)"
  espera_min_s: 1.5        # >= 1 s entre peticiones (regla de scraping responsable)
  reintentos: 3
  espera_reintento_s: 5     # se duplica en cada reintento
  timeout_s: 90

sisap:
  nombre: "SISAP v2.0 - Modulo de Mercados Mayoristas (MIDAGRI)"
  portal: "http://sistemas.midagri.gob.pe/sisap/portal/"
  # HTTPS falla en el handshake TLS (2026-11-14); se usa HTTP.
  base: "http://sistemas.midagri.gob.pe/sisap/portal2/mayorista/"
  endpoints:
    inicio: ""                                  # GET: fija cookie de sesion 'autentificator'
    generos_por_mercado: "generos/filtrarPorMercado"   # POST mercado=<cod>
    variedades_por_genero: "variedades/filtrarPorGenero" # POST expandir=<cod_genero>~checkBox
    consulta: "resumenes/filtrar"               # POST formulario de consulta (devuelve tabla HTML)
  guia_pdf: "http://sistemas.midagri.gob.pe/sisap/portal2/mayorista/external_files/GUIA DE CONSULTA.pdf"
  mercados:
    GMML: "15011501"     # Gran mercado mayorista de lima
    MM2_FRUTAS: "15011502"   # Mercado mayorista nro 2-frutas
  genero_limon: "0611"   # 'Limon'
  variedades_limon:
    "061101": "Limon sutil bolsa"
    "061102": "Limon sutil cajon"
    "061106": "Limon tahiti"
  variables: [precio_max, precio_prom, precio_min, volumen]
  # Procedencias (departamentos) tal como las lista el formulario; 510000 = desconocida.
  procedencias: ["010000","020000","030000","040000","050000","060000","070000","080000",
                 "090000","100000","110000","120000","130000","140000","150000","160000",
                 "170000","180000","190000","200000","210000","220000","230000","240000",
                 "250000","510000"]
  # Muestra del dia 1 (T2/T3). periodicidad: intervalo | mensual
  muestra:
    - {id: gmml_2016_03, mercado: GMML, periodicidad: intervalo, desde: "01/03/2016", hasta: "10/03/2016"}
    - {id: gmml_2019_anual, mercado: GMML, periodicidad: intervalo, desde: "01/01/2019", hasta: "31/12/2019"}
    - {id: gmml_2023_12, mercado: GMML, periodicidad: intervalo, desde: "15/12/2023", hasta: "10/01/2024"}
    - {id: gmml_2025_09_10, mercado: GMML, periodicidad: intervalo, desde: "01/09/2025", hasta: "31/10/2025"}
    - {id: gmml_2026_ultimo, mercado: GMML, periodicidad: intervalo, desde: "15/10/2026", hasta: "14/11/2026"}
    - {id: gmml_mensual_1997_2026, mercado: GMML, periodicidad: mensual, anios: "1997-2026"}
    - {id: mm2_mensual_1997_2026, mercado: MM2_FRUTAS, periodicidad: mensual, anios: "1997-2026"}
    # En MM2 las variedades 0611xx no devuelven datos: se consulta el genero completo.
    - {id: mm2_2026_11_genero, mercado: MM2_FRUTAS, periodicidad: intervalo, desde: "01/11/2026", hasta: "13/11/2026", productos: ["0611"]}

gobpe:
  nombre: "Reportes diarios en gob.pe (MIDAGRI)"
  robots: "https://www.gob.pe/robots.txt"   # prohibe /*?sheet= -> no se pagina
  colecciones:
    GMML: "https://www.gob.pe/institucion/midagri/colecciones/335-reporte-de-ingreso-y-precios-en-el-gran-mercado-mayorista-de-lima"
    MM2_FRUTAS: "https://www.gob.pe/institucion/midagri/colecciones/14-reporte-de-ingreso-y-precios-en-el-mercado-mayorista-de-frutas-n-2"
  # Paginas mensuales de las que se toma un PDF de muestra (primer PDF listado).
  muestra_paginas_mensuales:
    - {id: gmml_2021_02, url: "https://www.gob.pe/institucion/midagri/informes-publicaciones/1625697-reporte-de-ingreso-y-precios-en-el-gran-mercado-mayorista-de-lima-gmml-febrero-2021"}
    - {id: gmml_2023_12, url: "https://www.gob.pe/institucion/midagri/informes-publicaciones/4910329-reporte-de-ingreso-y-precios-en-el-gran-mercado-mayorista-de-lima-gmml-diciembre-2023"}
    - {id: gmml_2025_10, url: "https://www.gob.pe/institucion/midagri/informes-publicaciones/7244910-reporte-de-ingreso-y-precios-en-el-gran-mercado-mayorista-de-lima-gmml-octubre-2025"}
  # Pagina mensual de MM N.2 a muestrear: se toma la primera listada en su coleccion.
  muestra_mm2_desde_coleccion: true

otras_fuentes:
  siea_precios: "https://siea.midagri.gob.pe/portal/precios"
  datos_abiertos: "https://www.datosabiertos.gob.pe/"
  gobpe_consultar_precios: "https://www.gob.pe/institucion/midagri/pages/7712-consultar-precios-mayoristas-de-alimentos"

# ---------------------------------------------------------------- dia 2
descarga:
  productos: ["061101", "061102"]     # Limon sutil bolsa, Limon sutil cajon (GMML)
  sondeo_anios: [1997, 2000, 2005, 2010, 2012]   # semana 1-7 de marzo de cada anio
  fecha_corte: "2026-11-13"           # ultimo dia completo (la consulta del 2026-11-14 incluia el mismo dia)
  # Fechas con '...' en el volumen del SISAP para comparar con el PDF de gob.pe (se fijan tras ver los datos)
  control_pdf: ["2024-11-20", "2024-12-25", "2024-12-26", "2025-01-04", "2025-01-07", "2025-10-15", "2025-10-16", "2026-07-08"]

